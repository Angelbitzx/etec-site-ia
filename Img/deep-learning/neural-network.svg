<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de uma rede neural artificial</title>
  <desc id="description">Neurônios organizados em camadas de entrada, ocultas e saída, conectados entre si.</desc>
  <rect width="720" height="400" rx="28" fill="#f4f8fc"/>
  <g fill="none" stroke="#80a9cf" stroke-width="3">
    <path d="M130 110 300 80M130 110 300 200M130 110 300 320M130 200 300 80M130 200 300 200M130 200 300 320M130 290 300 80M130 290 300 200M130 290 300 320"/>
    <path d="M330 80 500 110M330 80 500 200M330 80 500 290M330 200 500 110M330 200 500 200M330 200 500 290M330 320 500 110M330 320 500 200M330 320 500 290"/>
    <path d="M530 110 630 155M530 200 630 200M530 290 630 245"/>
  </g>
  <g fill="#fff" stroke="#1971c2" stroke-width="5">
    <circle cx="110" cy="110" r="22"/><circle cx="110" cy="200" r="22"/><circle cx="110" cy="290" r="22"/>
    <circle cx="310" cy="80" r="22"/><circle cx="310" cy="200" r="22"/><circle cx="310" cy="320" r="22"/>
    <circle cx="510" cy="110" r="22"/><circle cx="510" cy="200" r="22"/><circle cx="510" cy="290" r="22"/>
  </g>
  <g fill="#173b67" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="110" y="365">Entrada</text><text x="310" y="365">Camadas ocultas</text><text x="510" y="365">Saída</text>
  </g>
  <circle cx="650" cy="200" r="24" fill="#ffb547" stroke="#d68700" stroke-width="5"/>
</svg>
